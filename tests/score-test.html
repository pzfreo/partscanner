<script type="module">
import { parsePage, buildScore } from "../score.js";
const names = ["C","C#","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
const nn = (m) => names[m % 12] + (Math.floor(m / 12) - 1);
const xmls = await Promise.all([0,1,2,3].map(i => fetch(`../testdata/huron_${i}.musicxml`).then(r => r.text())));
const s = buildScore(xmls.map(parsePage));
const bar = (line, b) => { const m = s.measures[b-1]; return line.notes.filter(n => n.t >= m.start && n.t < m.start + m.length).map(n => nn(n.midi) + "/" + n.dur).join(" "); };
const out = { measures: s.measures.length, length: s.length, lines: s.lines.map(l => ({ label: l.label, n: l.notes.length, bars: Object.fromEntries([1,2,7,13,23,26,30,45,65,85].map(b => [b, bar(l, b)])) })) };
window.result = out;
</script>
