<!doctype html>
<meta charset="utf-8">
<title>Render sample</title>
<!-- Used by scripts/render-sample.mjs to engrave the sample score; not deployed. -->
<style>
  @page { size: A4; margin: 0; }
  body { margin: 0; }
  .page { width: 210mm; height: 297mm; page-break-after: always; display: flex; align-items: flex-start; justify-content: center; }
  .page svg { width: 210mm; height: 297mm; }
</style>
<body>
<script type="module">
import createVerovioModule from "https://cdn.jsdelivr.net/npm/verovio@6.3.0/dist/verovio-module.mjs";
import { VerovioToolkit } from "https://cdn.jsdelivr.net/npm/verovio@6.3.0/dist/verovio.mjs";
const module = await createVerovioModule();
const tk = new VerovioToolkit(module);
tk.setOptions({
  pageWidth: 2100, pageHeight: 2970, pageMarginTop: 120, pageMarginBottom: 120, pageMarginLeft: 140, pageMarginRight: 140,
  scale: 50, breaks: "encoded", lyricSize: 3.6, footer: "none", header: "auto", adjustPageHeight: false,
});
tk.loadData(await (await fetch("joyful-joyful.musicxml")).text());
for (let p = 1; p <= tk.getPageCount(); p++) {
  const div = document.createElement("div");
  div.className = "page";
  div.innerHTML = tk.renderToSVG(p);
  document.body.append(div);
}
window.result = { pages: tk.getPageCount() };
</script>
