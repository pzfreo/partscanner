name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch homr source and models
        run: scripts/fetch-homr.sh
      - name: Assemble site
        run: |
          mkdir -p _site/vendor
          cp -r index.html app.js score.js player.js styles.css omr-worker.js sw.js \
            manifest.webmanifest icon.svg icon-192.png icon-512.png omr models _site/
          cp vendor/homr.zip _site/vendor/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
